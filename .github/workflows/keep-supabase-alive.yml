name: Keep Supabase alive

# Le projet Supabase est sur le plan gratuit, qui met la base en pause après 7 jours sans
# requête SQL. Ce workflow fait une vraie requête (pas un simple ping HTTP) tous les 3 jours
# pour éviter la pause. NE PAS DÉSACTIVER tant que le projet reste sur ce plan (voir
# docs/TODO.md/DECISIONS.md), sous peine de devoir réactiver la base manuellement depuis le
# dashboard Supabase après une pause.
on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Versions figées du package-lock.json plutôt que la dernière version publiée : le
      # 2026-10-07, une publication incomplète de supabase-js 2.117.3 (realtime-js introuvable
      # sur npm) a fait échouer ce workflow.
      - run: npm ci --ignore-scripts
      - run: node scripts/ping-supabase.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
